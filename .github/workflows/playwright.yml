name: Playwright Tests
# Manual only: the full suite needs headed Edge, repository variables/secrets and DB access,
# so it must not run on every push. Homepage UI has its own sharded workflow (homepage-ui.yml).
on:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps msedge
    - name: Run Playwright tests
      run: xvfb-run --auto-servernum npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
