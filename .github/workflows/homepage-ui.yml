name: Homepage UI Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'BusinessTestCases/Homepage/**'
      - 'BusinessTestCases/pageElements/**'
      - 'support/**'
      - '.github/workflows/homepage-ui.yml'

jobs:
  test:
    name: Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Every GitHub repository variable becomes a line in .env.dev, which playwright.config.ts loads.
      - name: Write .env.dev from repository variables
        env:
          REPO_VARS: ${{ toJSON(vars) }}
        run: printf '%s' "$REPO_VARS" | jq -r 'to_entries[] | "\(.key)=\(.value | @json)"' > .env.dev
      # The config's only project is headed Microsoft Edge, so install Edge and give it a virtual display.
      - run: npx playwright install --with-deps msedge
      - name: Run Homepage UI specs (shard ${{ matrix.shard }}/4)
        run: xvfb-run --auto-servernum npx playwright test BusinessTestCases/Homepage/ui --reporter=blob --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-reports:
    name: Merge HTML report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-ui-html-report
          path: playwright-report/
          retention-days: 30
